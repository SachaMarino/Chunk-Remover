# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (readable parameter names + javadoc)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[1,)

# Dependencies (must match what is installed in the game instance)
# https://maven.ftb.dev/releases/dev/ftb/mods/
ftb_chunks_version=2101.1.22
ftb_library_version=2101.1.37
ftb_teams_version=2101.1.11
# https://maven.architectury.dev/dev/architectury/architectury-neoforge/
architectury_version=13.0.11

# Mod properties
mod_id=chunkremover
mod_name=Chunk Remover
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.sachamarino.chunkremover
mod_authors=Sacha
mod_description=Select an area on the FTB Chunks map and delete every generated chunk inside it. The world regenerates them on the next visit and the save file shrinks.
