# Chunk Remover access transformers (Mojang names).
#
# The deletion runs the region-file work on the IO thread of each storage so it is serialized with
# vanilla reads and writes, and it needs the private storage layers to find the files and caches.

# IOWorker: run a task on the IO thread, reach the region file storage, blender cache
public net.minecraft.world.level.chunk.storage.IOWorker submitTask(Ljava/util/function/Supplier;)Ljava/util/concurrent/CompletableFuture;
public net.minecraft.world.level.chunk.storage.IOWorker storage
public net.minecraft.world.level.chunk.storage.IOWorker regionCacheForBlender

# RegionFileStorage: open region file cache and the folder it reads from
public net.minecraft.world.level.chunk.storage.RegionFileStorage regionCache
public net.minecraft.world.level.chunk.storage.RegionFileStorage folder

# Storage front-ends -> their IOWorker
public net.minecraft.world.level.chunk.storage.ChunkStorage worker
public net.minecraft.world.level.chunk.storage.SimpleRegionStorage worker
public net.minecraft.world.level.chunk.storage.SectionStorage simpleRegionStorage
public net.minecraft.world.level.chunk.storage.SectionStorage dirty
public net.minecraft.world.level.chunk.storage.EntityStorage simpleRegionStorage

